<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科研奖励获奖信息查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .level-national { background: #DC2626; }
        .level-provincial { background: #EA580C; }
        .level-municipal { background: #CA8A04; }
        .level-school { background: #059669; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app"></div>

<script>
// ==================== 数据层 ====================
const mockData = [
    { id: 1, name: '高性能计算在材料科学中的应用', award_name: '国家自然科学奖', category: '自然科学', level: '国家级', year: 2023, session: 5, recipients: '张三, 李四', organization: '清华大学', department: '计算机科学与技术系', description: '该研究将高性能计算技术应用于新材料的开发，取得了突破性成果。', created_at: '2024-01-15' },
    { id: 2, name: '人工智能在医学影像诊断中的研究', award_name: '国家科技进步奖', category: '科技进步', level: '国家级', year: 2023, session: 7, recipients: '王五, 赵六', organization: '北京大学', department: '人工智能研究院', description: '开发了一套基于深度学习的医学影像诊断系统，准确率达到95%以上。', created_at: '2024-01-14' },
    { id: 3, name: '新型能源材料的研发', award_name: '北京市科学技术奖', category: '科学技术', level: '市级', year: 2022, session: 12, recipients: '钱七, 孙八', organization: '北京理工大学', department: '材料科学与工程学院', description: '研发的新型电池材料显著提升了能量密度。', created_at: '2024-01-13' },
    { id: 4, name: '量子计算理论研究', award_name: '国家自然科学奖', category: '自然科学', level: '国家级', year: 2022, session: 4, recipients: '周九', organization: '中国科学院', department: '计算技术研究所', description: '在量子算法设计方面取得重要突破。', created_at: '2024-01-12' },
    { id: 5, name: '5G通信网络优化', award_name: '广东省科技进步奖', category: '科技进步', level: '省级', year: 2023, session: 8, recipients: '吴十, 郑十一', organization: '华南理工大学', department: '电子与信息学院', description: '提出的通信网络优化方案提升了网络效率30%。', created_at: '2024-01-11' },
    { id: 6, name: '新型抗癌药物研发', award_name: '国家科技进步奖', category: '医药科技', level: '国家级', year: 2024, session: 6, recipients: '陈十二, 林十三', organization: '复旦大学', department: '药学院', description: '研发的新型靶向药物在临床试验中显示出良好的疗效。', created_at: '2024-01-10' },
    { id: 7, name: '智能交通系统研究', award_name: '上海市科技进步奖', category: '工程技术', level: '市级', year: 2023, session: 9, recipients: '黄十四', organization: '上海交通大学', department: '电子信息与电气工程学院', description: '构建了城市级智能交通管理系统。', created_at: '2024-01-09' },
    { id: 8, name: '深海探测技术研究', award_name: '国家技术发明奖', category: '技术发明', level: '国家级', year: 2023, session: 3, recipients: '刘十五, 杨十六', organization: '中国海洋大学', department: '海洋与大气学院', description: '自主研发的深海探测设备达到国际先进水平。', created_at: '2024-01-08' }
];

// ==================== 状态管理 ====================
const store = {
    user: JSON.parse(localStorage.getItem('user') || 'null'),
    favorites: JSON.parse(localStorage.getItem('favorites') || '[]'),
    currentPage: 'home',
    searchKeyword: '',
    
    login(user) { this.user = user; localStorage.setItem('user', JSON.stringify(user)); },
    logout() { this.user = null; localStorage.removeItem('user'); this.favorites = []; localStorage.removeItem('favorites'); },
    addFavorite(id) { if (!this.favorites.includes(id)) { this.favorites.push(id); localStorage.setItem('favorites', JSON.stringify(this.favorites)); } },
    removeFavorite(id) { this.favorites = this.favorites.filter(x => x !== id); localStorage.setItem('favorites', JSON.stringify(this.favorites)); },
    isFavorite(id) { return this.favorites.includes(id); }
};

// ==================== 工具函数 ====================
const utils = {
    getLevelColor(level) { return { '国家级': 'bg-red-600', '省级': 'bg-orange-600', '市级': 'bg-yellow-600', '校级': 'bg-emerald-600' }[level] || 'bg-slate-600'; },
    getStats() {
        const total = mockData.length;
        const national = mockData.filter(a => a.level === '国家级').length;
        const provincial = mockData.filter(a => a.level === '省级').length;
        const municipal = mockData.filter(a => a.level === '市级').length;
        const school = mockData.filter(a => a.level === '校级').length;
        const organizations = new Set(mockData.map(a => a.organization)).size;
        const awardTypes = new Set(mockData.map(a => a.award_name)).size;
        return { total, national, provincial, municipal, school, organizations, awardTypes };
    },
    search(keyword) {
        if (!keyword) return mockData;
        const k = keyword.toLowerCase();
        return mockData.filter(a => 
            a.name.toLowerCase().includes(k) || a.award_name.toLowerCase().includes(k) ||
            (a.recipients && a.recipients.toLowerCase().includes(k)) ||
            (a.organization && a.organization.toLowerCase().includes(k))
        );
    },
    formatDate(dateStr) { return dateStr ? new Date(dateStr).toLocaleDateString('zh-CN') : '-'; }
};

// ==================== 应用主类 ====================
class App {
    constructor() { this.render(); }
    
    navigate(page) { store.currentPage = page; this.render(); }
    search(keyword) { store.searchKeyword = keyword; store.currentPage = 'search'; this.render(); }
    toggleFavorite(id) { if (store.isFavorite(id)) store.removeFavorite(id); else store.addFavorite(id); this.render(); }
    
    getLevelColor(level) { return utils.getLevelColor(level); }
    getStats() { return utils.getStats(); }
    
    // 渲染方法
    render() {
        const container = document.getElementById('app');
        container.innerHTML = `
            <div class="min-h-screen">
                ${this.header()}
                <div class="flex">
                    ${this.sidebar()}
                    <main class="flex-1 overflow-y-auto">${this.currentPage()}</main>
                </div>
            </div>
        `;
        this.initChart();
    }
    
    header() {
        const user = store.user;
        return `
            <header class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white shadow-xl sticky top-0 z-50">
                <div class="max-w-7xl mx-auto px-6 py-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center text-2xl shadow-lg">
                                🏆
                            </div>
                            <div>
                                <h1 class="text-xl font-bold bg-gradient-to-r from-white to-emerald-300 bg-clip-text text-transparent">
                                    科研奖励获奖信息查询系统
                                </h1>
                                <p class="text-xs text-slate-400">Scientific Research Award Information System</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            ${user ? `
                                <div class="flex items-center gap-3 bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-full flex items-center justify-center text-base font-bold">
                                        ${(user.nickname || user.username)[0]}
                                    </div>
                                    <div class="text-left">
                                        <p class="font-medium text-slate-100">${user.nickname || user.username}</p>
                                        <p class="text-xs text-slate-400">${user.is_admin ? '系统管理员' : '普通用户'}</p>
                                    </div>
                                    <button onclick="app.handleLogout()" 
                                        class="ml-2 px-3 py-1.5 bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white rounded-lg transition-all text-sm">
                                        退出
                                    </button>
                                </div>
                            ` : `
                                <div class="flex items-center gap-3">
                                    <button onclick="app.navigate('login')" 
                                        class="px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                                        登录
                                    </button>
                                    <button onclick="app.navigate('login')" 
                                        class="px-5 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transition-all">
                                        立即体验
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            </header>
        `;
    }
    
    sidebar() {
        const user = store.user;
        const isAdmin = user && user.is_admin;
        const navs = [
            { id: 'home', label: '首页', icon: '🏠', desc: '系统概览' },
            { id: 'search', label: '搜索查询', icon: '🔍', desc: '查找获奖信息' },
            { id: 'statistics', label: '统计分析', icon: '📊', desc: '数据可视化' },
            { id: 'favorites', label: '我的收藏', icon: '⭐', desc: '收藏的条目' },
            ...(isAdmin ? [{ id: 'admin', label: '数据管理', icon: '⚙️', desc: '导入导出数据' }] : [])
        ];
        
        return `
            <aside class="w-64 bg-white border-r border-slate-200 min-h-[calc(100vh-73px)] flex flex-col shadow-sm">
                <nav class="flex-1 p-4 space-y-2">
                    ${navs.map(nav => `
                        <div onclick="app.navigate('${nav.id}')" 
                            class="group flex items-center gap-4 px-4 py-4 rounded-xl cursor-pointer transition-all ${store.currentPage === nav.id 
                                ? 'bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-700 border border-emerald-200 shadow-sm' 
                                : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent'}">
                            <div class="w-10 h-10 ${store.currentPage === nav.id 
                                ? 'bg-gradient-to-br from-emerald-500 to-teal-600 text-white' 
                                : 'bg-slate-100 text-slate-500 group-hover:bg-slate-200'} rounded-xl flex items-center justify-center text-xl transition-all">
                                ${nav.icon}
                            </div>
                            <div>
                                <p class="font-semibold">${nav.label}</p>
                                <p class="text-xs text-slate-400">${nav.desc}</p>
                            </div>
                        </div>
                    `).join('')}
                </nav>
                
                ${!user ? `
                    <div class="p-4 border-t border-slate-200 bg-slate-50">
                        <div class="bg-gradient-to-br from-emerald-50 to-teal-50 rounded-xl p-5 border border-emerald-100">
                            <p class="text-sm font-medium text-slate-800 mb-2">🔒 解锁完整功能</p>
                            <p class="text-xs text-slate-500 mb-4">登录后可使用收藏和数据管理功能</p>
                            <button onclick="app.navigate('login')" 
                                class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all">
                                登录账户
                            </button>
                        </div>
                    </div>
                ` : ''}
            </aside>
        `;
    }
    
    currentPage() {
        switch (store.currentPage) {
            case 'home': return this.homePage();
            case 'search': return this.searchPage();
            case 'detail': return this.detailPage();
            case 'statistics': return this.statisticsPage();
            case 'favorites': return this.favoritesPage();
            case 'admin': return this.adminPage();
            case 'login': return this.loginPage();
            default: return this.homePage();
        }
    }
    
    homePage() {
        const stats = this.getStats();
        const hotAwards = mockData.slice(0, 5);
        
        return `
            <div class="p-8 fade-in max-w-7xl mx-auto">
                <!-- Hero Section -->
                <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 rounded-3xl p-10 text-white mb-10 shadow-2xl">
                    <div class="flex items-start justify-between">
                        <div class="max-w-2xl">
                            <h2 class="text-3xl font-bold mb-4">
                                欢迎使用科研奖励查询系统
                            </h2>
                            <p class="text-slate-300 text-lg mb-8 leading-relaxed">
                                一站式查询各类科研获奖成果，支持多维度搜索、统计分析和数据可视化
                            </p>
                            <div class="flex gap-4">
                                <div class="flex-1 relative">
                                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">🔍</span>
                                    <input type="text" id="home-search" placeholder="搜索获奖者、单位、奖项或成果名称..."
                                        class="w-full pl-12 pr-4 py-4 rounded-2xl text-slate-900 outline-none shadow-lg focus:ring-4 focus:ring-emerald-500/30 text-base"
                                        onkeypress="if(event.key==='Enter') app.search(this.value)">
                                </div>
                                <button onclick="app.search(document.getElementById('home-search').value)" 
                                    class="px-8 py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-2xl shadow-lg hover:shadow-xl transition-all">
                                    开始搜索
                                </button>
                            </div>
                            <div class="flex gap-3 mt-6 flex-wrap">
                                ${['国家级', '省级', '市级', '2024年', '2023年'].map(f => `
                                    <button onclick="app.search('${f}')" 
                                        class="px-4 py-2 bg-white/10 hover:bg-white/20 backdrop-blur rounded-xl text-sm transition-all border border-white/10">
                                        ${f}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        <div class="hidden lg:block">
                            <div class="text-8xl opacity-20">🏆</div>
                        </div>
                    </div>
                </div>
                
                <!-- Stats Cards -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 hover:shadow-xl transition-all cursor-pointer" onclick="app.navigate('statistics')">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">
                                🏆
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-slate-800">${stats.total}</p>
                                <p class="text-slate-500 text-sm">总获奖数</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 hover:shadow-xl transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">
                                🏛️
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-slate-800">${stats.organizations}</p>
                                <p class="text-slate-500 text-sm">获奖单位</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 hover:shadow-xl transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-orange-500 to-amber-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">
                                🎖️
                            </div>
                            <div>
                                <p class="text-3xl font-bold text-slate-800">${stats.awardTypes}</p>
                                <p class="text-slate-500 text-sm">奖项种类</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 hover:shadow-xl transition-all cursor-pointer" onclick="app.navigate('statistics')">
                        <div class="flex items-center gap-4">
                            <div class="w-14 h-14 bg-gradient-to-br from-purple-500 to-violet-600 rounded-2xl flex items-center justify-center text-3xl shadow-lg">
                                📈
                            </div>
                            <div>
                                <p class="text-lg font-bold text-slate-800">查看统计</p>
                                <p class="text-slate-500 text-sm">详细数据分析</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Main Content -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Hot Awards -->
                    <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
                        <div class="px-6 py-5 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white">
                            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                🔥 热门获奖
                            </h3>
                        </div>
                        <div class="p-4 space-y-3">
                            ${hotAwards.map(a => `
                                <div onclick="app.navigateToDetail(${a.id})" 
                                    class="flex items-start gap-4 p-4 rounded-xl hover:bg-slate-50 cursor-pointer transition-all border border-transparent hover:border-slate-200">
                                    <div class="w-2 h-14 rounded-full ${this.getLevelColor(a.level)} flex-shrink-0"></div>
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-semibold text-slate-800 truncate">${a.name}</h4>
                                        <p class="text-emerald-600 text-sm font-medium mt-1">${a.award_name}</p>
                                        <p class="text-slate-500 text-sm mt-1">${a.recipients} · ${a.year}年</p>
                                    </div>
                                    <div class="text-slate-400 text-xl">›</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <!-- Recent Awards -->
                    <div class="bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
                        <div class="px-6 py-5 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white">
                            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                📋 最新获奖
                            </h3>
                        </div>
                        <div class="p-4 space-y-3">
                            ${[...mockData].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5).map(a => `
                                <div onclick="app.navigateToDetail(${a.id})" 
                                    class="flex items-center justify-between p-4 rounded-xl hover:bg-slate-50 cursor-pointer transition-all border border-transparent hover:border-slate-200">
                                    <div class="flex-1 min-w-0">
                                        <h4 class="font-semibold text-slate-800 truncate">${a.name}</h4>
                                        <p class="text-slate-500 text-sm mt-1">${a.award_name} · ${a.recipients}</p>
                                    </div>
                                    <span class="text-slate-400 text-xl">›</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    searchPage() {
        const results = utils.search(store.searchKeyword);
        
        return `
            <div class="h-full flex flex-col fade-in">
                <div class="bg-white border-b border-slate-200 p-6 shadow-sm">
                    <div class="max-w-5xl mx-auto">
                        <div class="flex gap-4 mb-6">
                            <div class="flex-1 relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">🔍</span>
                                <input type="text" id="search-input" placeholder="搜索获奖者、单位、成果名称或奖项..."
                                    class="w-full pl-12 pr-4 py-4 rounded-xl border-2 border-slate-200 outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 transition-all text-base"
                                    value="${store.searchKeyword}" onkeypress="if(event.key==='Enter') app.search(this.value)">
                            </div>
                            <button onclick="app.search(document.getElementById('search-input').value)" 
                                class="px-8 py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all">
                                搜索
                            </button>
                        </div>
                        <div class="flex gap-3 flex-wrap">
                            ${['全部', '国家级', '省级', '市级', '校级'].map(l => `
                                <button onclick="app.search('${l === '全部' ? '' : l}')" 
                                    class="px-5 py-2.5 rounded-xl text-sm font-medium transition-all ${!store.searchKeyword || store.searchKeyword === l 
                                        ? 'bg-gradient-to-r from-emerald-500 to-teal-600 text-white shadow-md' 
                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                    ${l}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-8">
                    <div class="max-w-5xl mx-auto">
                        <p class="mb-6 text-slate-600 font-medium">
                            共找到 <span class="text-emerald-600 text-xl font-bold">${results.length}</span> 条结果
                        </p>
                        <div class="space-y-4">
                            ${results.length === 0 ? `
                                <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                                    <p class="text-7xl mb-6">🔍</p>
                                    <p class="text-xl mb-2">暂无搜索结果</p>

    getTopRecipients() {
        const recipientMap = {};
        mockData.forEach(a => {
            (a.recipients || '').split(/[,，、]/).forEach(n => {
                if (n.trim()) recipientMap[n.trim()] = (recipientMap[n.trim()] || 0) + 1;
            });
        });
        return Object.entries(recipientMap).sort((a,b) => b[1] - a[1]).slice(0, 5).map(([name, count], i) => {
            const colors = ['from-red-500 to-rose-600', 'from-orange-500 to-amber-600', 'from-yellow-500 to-lime-600', 'from-slate-400 to-slate-500', 'from-slate-300 to-slate-400'];
            return `
                <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <div class="w-10 h-10 bg-gradient-to-br ${colors[i]} rounded-full flex items-center justify-center text-sm font-bold text-white shadow-md">
                        ${i + 1}
                    </div>
                    <span class="flex-1 font-semibold text-slate-800">${name}</span>
                    <span class="text-emerald-600 font-bold text-lg">${count}次</span>
                </div>
            `;
        }).join('');
    }
    
    getTopOrgs() {
        const orgMap = {};
        mockData.forEach(a => {
            if (a.organization) orgMap[a.organization] = (orgMap[a.organization] || 0) + 1;
        });
        return Object.entries(orgMap).sort((a,b) => b[1] - a[1]).slice(0, 5).map(([name, count], i) => {
            const colors = ['from-red-500 to-rose-600', 'from-orange-500 to-amber-600', 'from-yellow-500 to-lime-600', 'from-slate-400 to-slate-500', 'from-slate-300 to-slate-400'];
            return `
                <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <div class="w-10 h-10 bg-gradient-to-br ${colors[i]} rounded-full flex items-center justify-center text-sm font-bold text-white shadow-md">
                        ${i + 1}
                    </div>
                    <span class="flex-1 font-semibold text-slate-800">${name}</span>
                    <span class="text-emerald-600 font-bold text-lg">${count}次</span>
                </div>
            `;
        }).join('');
    }
    
    initChart() {
        if (store.currentPage !== 'statistics') return;
        
        const stats = this.getStats();
        
        // Pie Chart
        const pieCtx = document.getElementById('statsChart');
        if (pieCtx) {
            new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['国家级', '省级', '市级', '校级'],
                    datasets: [{
                        data: [stats.national, stats.provincial, stats.municipal, stats.school],
                        backgroundColor: ['#DC2626', '#EA580C', '#CA8A04', '#059669'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 20, font: { size: 14 } } }
                    }
                }
            });
        }
        
        // Trend Chart
        const trendCtx = document.getElementById('trendChart');
        if (trendCtx) {
            const yearMap = {};
            mockData.forEach(a => { yearMap[a.year] = (yearMap[a.year] || 0) + 1; });
            const years = Object.keys(yearMap).sort();
            
            new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: years,
                    datasets: [{
                        label: '获奖数量',
                        data: years.map(y => yearMap[y]),
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#059669',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }
    }

                        <div id="login-error" class="hidden p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm mb-6"></div>
                        
                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">用户名</label>
                                <input type="text" id="login-username" placeholder="请输入用户名"
                                    class="w-full px-5 py-4 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 transition-all text-base">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">密码</label>
                                <input type="password" id="login-password" placeholder="请输入密码"
                                    class="w-full px-5 py-4 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/20 transition-all text-base"
                                    onkeypress="if(event.key==='Enter') app.handleLogin()">
                            </div>
                            <button onclick="app.handleLogin()" 
                                class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all text-lg">
                                登录
                            </button>
                        </div>
                        
                        <div class="mt-8 p-6 bg-gradient-to-br from-slate-50 to-emerald-50 rounded-2xl border border-slate-100">
                            <p class="text-sm font-semibold text-slate-800 mb-4">📋 默认账户信息：</p>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-white p-4 rounded-xl border border-slate-100">
                                    <p class="text-xs text-slate-500 mb-1">管理员</p>
                                    <p class="font-semibold text-slate-800 text-sm">admin / admin123</p>
                                </div>
                                <div class="bg-white p-4 rounded-xl border border-slate-100">
                                    <p class="text-xs text-slate-500 mb-1">普通用户</p>
                                    <p class="font-semibold text-slate-800 text-sm">user / user123</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    handleLogin() {
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        const errorDiv = document.getElementById('login-error');
        
        if (!username || !password) {
            errorDiv.textContent = '请输入用户名和密码';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        if (username === 'admin' && password === 'admin123') {
            store.login({ id: 1, username: 'admin', nickname: '系统管理员', is_admin: true });
            this.navigate('home');
        } else if (username === 'user' && password === 'user123') {
            store.login({ id: 2, username: 'user', nickname: '普通用户', is_admin: false });
            this.navigate('home');
        } else {
            errorDiv.textContent = '用户名或密码错误';
            errorDiv.classList.remove('hidden');
        }
    }
    
    handleLogout() {
        store.logout();
        this.render();
    }
    
    navigateToDetail(id) { store.detailId = id; store.currentPage = 'detail'; this.render(); }
    
    importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xlsx,.xls';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    let importedCount = 0;
                    const errors = [];
                    
                    workbook.SheetNames.forEach((sheetName, sheetIndex) => {
                        const worksheet = workbook.Sheets[sheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || !row[0]) continue;
                            
                            try {
                                const year = parseInt(row[0]) || new Date().getFullYear();
                                const awardName = (row[1] || '').toString() || '未命名奖项';
                                const recipients = (row[2] || '').toString().replace(/、/g, ',');
                                const organization = (row[3] || '').toString().replace(/、/g, ',');
                                
                                let level = '校级';
                                if (awardName.includes('国家')) level = '国家级';
                                else if (awardName.includes('省')) level = '省级';
                                else if (awardName.includes('市')) level = '市级';
                                
                                mockData.push({
                                    id: mockData.length + 1,
                                    name: awardName,
                                    award_name: awardName,
                                    category: '未分类',
                                    level,
                                    year,
                                    session: null,
                                    recipients,
                                    organization,
                                    department: '',
                                    description: '来自表格: ' + sheetName + '，第' + (i+1) + '行',
                                    created_at: new Date().toISOString().split('T')[0]
                                });
                                importedCount++;
                            } catch (err) {
                                errors.push('Sheet ' + sheetName + ' 第' + (i+1) + '行: ' + err.message);
                            }
                        }
                    });
                    
                    let message = '成功导入 ' + importedCount + ' 条数据！';
                    if (errors.length > 0) {
                        message += '\n\n导入失败 ' + errors.length + ' 条：\n' + errors.join('\n');
                    }
                    alert(message);
                    this.render();
                } catch (err) {
                    alert('导入失败: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }
    
    exportData() { alert('导出功能开发中。'); }
    deleteAward(id) { if (confirm('确定要删除这条获奖信息吗？')) { alert('删除功能开发中。'); } }
}

// 初始化应用
const app = new App();
</script>
